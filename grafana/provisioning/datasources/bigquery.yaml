# Installed by scripts/grafana-provision.sh, which fills in the __PLACEHOLDERS__
# from bigquery.properties. Requires the grafana-bigquery-datasource plugin (3.x).
# With a service-account key (authenticationType jwt), the script copies the
# key's private part to /etc/grafana/faa-bigquery-key.pem, readable only by
# root and Grafana; on a Google Cloud VM (gce), Grafana uses the VM's service
# account, and the lines marked "jwt only" are left out.
# The dashboards refer to this datasource by its uid, bigquery-faa.
apiVersion: 1
datasources:
  - name: BigQuery FAA
    type: grafana-bigquery-datasource
    uid: bigquery-faa
    isDefault: true
    jsonData:
      authenticationType: __AUTH__
      defaultProject: __PROJECT__
      processingLocation: __LOCATION__
      clientEmail: __CLIENT_EMAIL__                      # jwt only
      tokenUri: https://oauth2.googleapis.com/token      # jwt only
      privateKeyPath: /etc/grafana/faa-bigquery-key.pem  # jwt only
