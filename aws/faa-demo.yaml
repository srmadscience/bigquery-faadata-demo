AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  clickhouse-faadata-demo on one EC2 instance: ClickHouse, Prometheus, node_exporter
  and Grafana, with FAA flight and weather data loaded. Ports 22 (SSH) and 3000
  (Grafana) are open. Setup and loading take 10 to 15 minutes after the stack is
  created; follow them in /var/log/faa-setup.log.

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 key pair for SSH as the ubuntu user
  InstanceType:
    Type: String
    Default: m7i.xlarge
    AllowedValues: [m7i.large, m7i.xlarge, m7i.2xlarge, m7i.4xlarge, r7i.large, r7i.xlarge, r7i.2xlarge, t3.xlarge, t3.2xlarge]
    Description: x86_64 instance type; 16 GB of memory or more is recommended
  VolumeSize:
    Type: Number
    Default: 100
    MinValue: 40
    Description: Root volume size in GB (the full load needs about 20 GB)
  AllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: ^\d{1,3}(\.\d{1,3}){3}/\d{1,2}$
    Description: Addresses allowed to reach SSH and Grafana, e.g. your-ip/32
  GrafanaPassword:
    Type: String
    Default: hiredavid
    NoEcho: true
    MinLength: 4
    Description: Password for Grafana's admin user
  LoadFrom:
    Type: String
    Default: 2016-01
    AllowedPattern: ^(\d{4}-\d{2}|none)$
    Description: First month of flights to load (YYYY-MM), or "none" to load nothing
  LoadTo:
    Type: String
    Default: 2026-07
    AllowedPattern: ^\d{4}-\d{2}$
    Description: Last month of flights to load (YYYY-MM)
  RepoUrl:
    Type: String
    Default: https://github.com/srmadscience/clickhouse-faadata-demo.git
    Description: Git repository to install
  RepoBranch:
    Type: String
    Default: main
    Description: Branch, tag or commit of the repository
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Ubuntu 24.04 AMI (the latest, by default)

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: !Ref AWS::StackName}]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{Key: Name, Value: !Ref AWS::StackName}]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: !Ref AWS::StackName}]

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Name, Value: !Ref AWS::StackName}]

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet
      RouteTableId: !Ref RouteTable

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH and Grafana
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref AllowedCidr, Description: SSH}
        - {IpProtocol: tcp, FromPort: 3000, ToPort: 3000, CidrIp: !Ref AllowedCidr, Description: Grafana}
      Tags: [{Key: Name, Value: !Ref AWS::StackName}]

  Instance:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref SecurityGroup]
      MetadataOptions: {HttpTokens: required}
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: {VolumeSize: !Ref VolumeSize, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
      Tags: [{Key: Name, Value: !Ref AWS::StackName}]
      # The repository's scripts/install-server.sh does the work; this clones the
      # repository and runs it. The Grafana password goes through a root-only file
      # rather than the command line.
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee -a /var/log/faa-setup.log) 2>&1
          echo "=== $(date '+%H:%M:%S') Cloning ${RepoUrl} (${RepoBranch})"
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -q && apt-get install -y -q git
          REPO=/home/ubuntu/clickhouse-faadata-demo
          [[ -d "$REPO" ]] || sudo -u ubuntu git clone -q "${RepoUrl}" "$REPO"
          sudo -u ubuntu git -C "$REPO" checkout -q "${RepoBranch}"
          install -m 600 /dev/null /root/grafana-password
          cat > /root/grafana-password <<'PASSWORD_EOF'
          ${GrafanaPassword}
          PASSWORD_EOF
          GRAFANA_PASSWORD=$(cat /root/grafana-password) APP_USER=ubuntu \
            "$REPO/scripts/install-server.sh" "${LoadFrom}" "${LoadTo}"
          rm -f /root/grafana-password

Outputs:
  GrafanaUrl:
    Description: Grafana (user admin); dashboards fill in as the data loads
    Value: !Sub http://${Instance.PublicDnsName}:3000
  SshCommand:
    Description: SSH to the instance; setup log in /var/log/faa-setup.log
    Value: !Sub ssh ubuntu@${Instance.PublicDnsName}
  PublicIp:
    Value: !GetAtt Instance.PublicIp
